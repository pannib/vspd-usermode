name: Build VSPD Kernel Driver (no local WDK needed)

# 路径 1：无需在本机安装 WDK。
# GitHub 的 windows-2022 / windows-latest Runner 已预装 WDK（22H2 / 10.0.26100）+ VS2022，
# 因此直接 msbuild 即可，不需要手动提供 EWDK ISO 链接。
#
# 构建完成后：
#   - 用仓库内置的测试证书（Vspd.Driver/cert/vspd-test.pfx）对 vspd.sys 做“测试签名”
#   - 打包 vspd.sys + vspd.inf + vspd-test.cer 为 vspd-driver.zip
#   - 发布到 Artifacts 与 GitHub Release（附件 vspd-driver.zip）
# 用户侧软件点「开启驱动」会自动：从 Release 下载该 zip → 导入证书 → 开启测试签名 → 安装并启动，
# 端口随即出现在「设备管理器 → 端口(COM 和 LPT)」。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Vspd.Driver/**'
      - '.github/workflows/build-driver.yml'

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build-driver:
    # windows-2022 预装 WDK 22H2；若想用更新的 WDK 可改为 windows-latest（Server 2025，WDK 10.0.26100）
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build vspd.sys (x64, Release)
        shell: cmd
        run: |
          msbuild Vspd.Driver\vspd.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10

      - name: Sign & package driver (zip)
        shell: pwsh
        env:
          CERT_PW: vspdtest
        run: |
          $sys = "Vspd.Driver\x64\Release\vspd.sys"
          if (-not (Test-Path $sys)) {
            Write-Error "未找到 vspd.sys，驱动构建失败，请查看上方 msbuild 日志。"
            exit 1
          }
          # 用仓库内置的测试证书对驱动做“测试签名”（仅测试签名模式下可加载）
          $pw = New-Object System.Security.SecureString
          $env:CERT_PW.ToCharArray() | ForEach-Object { $pw.AppendChar($_) }
          $cert = Get-PfxCertificate -FilePath "Vspd.Driver\cert\vspd-test.pfx" -Password $pw
          Set-AuthenticodeSignature -FilePath $sys -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          # 打包 vspd.sys + vspd.inf + 测试证书(.cer)，便于下载与安装时导入
          Compress-Archive -Path $sys, "Vspd.Driver\vspd.inf", "Vspd.Driver\cert\vspd-test.cer" -DestinationPath vspd-driver.zip -Force
          Write-Host "已签名并打包：vspd-driver.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vspd-driver
          path: vspd-driver.zip

      - name: Publish to GitHub Release (附件下载更方便)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vspd-driver-${{ github.run_number }}
          name: VSPD Driver Build ${{ github.run_number }}
          files: vspd-driver.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
