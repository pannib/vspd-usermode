name: Build VSPD Kernel Driver (no local WDK needed)

# 路径 1：无需在本机安装 WDK。
# GitHub 的 windows-2022 / windows-latest Runner 已预装 WDK（22H2 / 10.0.26100）+ VS2022，
# 因此直接 msbuild 即可，不需要手动提供 EWDK ISO 链接。
#
# 构建完成后：
#   - 每次构建自动生成一份自签测试证书，对 vspd.sys 做“测试签名”（不往仓库存私钥）
#   - 打包 vspd.sys + vspd.inf + vspd-test.cer 为 vspd-driver.zip
#   - 发布到 Artifacts 与 GitHub Release（附件 vspd-driver.zip）
# 用户侧软件点「开启驱动」会自动：从 Release 下载该 zip → 导入证书 → 开启测试签名 → 安装并启动，
# 端口随即出现在「设备管理器 → 端口(COM 和 LPT)」。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'VSPD/Vspd.Driver/**'
      - '.github/workflows/build-driver.yml'

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build-driver:
    # windows-2022 默认未预装 WDK；先安装 Windows Driver Kit(VS 组件)，再编译内核驱动
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows Driver Kit (WDK) into Visual Studio
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          $toolset = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0'
          $wdkBuild = 'C:\Program Files (x86)\Windows Kits\10\build\WindowsDriver.Common.targets'
          if (-not (Test-Path $installer)) { Write-Error "vs_installer.exe not found"; exit 1 }
          $log = "$env:RUNNER_TEMP\wdk_install.log"
          Write-Host "Launching WDK install (quiet)..."
          $p = Start-Process -FilePath $installer -ArgumentList @(
            'modify',
            '--installPath', 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise',
            '--add', 'Microsoft.VisualStudio.Component.WDK',
            '--quiet', '--norestart'
          ) -RedirectStandardOutput $log -RedirectStandardError "$env:RUNNER_TEMP\wdk_err.log" -PassThru
          $p.WaitForExit(900000)
          Write-Host "vs_installer exit code: $($p.ExitCode)"
          if (Test-Path $log) { Write-Host "--- installer stdout (tail) ---"; Get-Content $log -Tail 25 }
          if (Test-Path "$env:RUNNER_TEMP\wdk_err.log") { Write-Host "--- installer stderr (tail) ---"; Get-Content "$env:RUNNER_TEMP\wdk_err.log" -Tail 25 }
          # 安装引擎可能在父进程退出后才写完，轮询真正的 WDK 构建目标是否就绪
          $deadline = (Get-Date).AddMinutes(15)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $wdkBuild) { Write-Host "WDK build targets present."; break }
            Start-Sleep -Seconds 15
          }
          if (-not (Test-Path $wdkBuild)) { Write-Error "WDK build targets NOT found - WDK not installed"; exit 1 }
          Write-Host "WDK installed successfully."

      - name: Build vspd.sys (x64, Release)
        shell: cmd
        run: |
          msbuild VSPD\Vspd.Driver\vspd.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10

      - name: Sign & package driver (zip)
        shell: pwsh
        run: |
          $sys = "VSPD\Vspd.Driver\x64\Release\vspd.sys"
          if (-not (Test-Path $sys)) {
            Write-Error "未找到 vspd.sys，驱动构建失败，请查看上方 msbuild 日志。"
            exit 1
          }
          # 每次构建生成一份自签测试证书：签名与证书同包，安装时导入即可，避免仓库存私钥
          $pw = New-Object System.Security.SecureString
          "vspdtest".ToCharArray() | ForEach-Object { $pw.AppendChar($_) }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=VSPD Test Signing" `
                  -CertStoreLocation "Cert:\CurrentUser\My" -KeyUsage DigitalSignature `
                  -NotAfter (Get-Date).AddYears(10)
          Set-AuthenticodeSignature -FilePath $sys -Certificate $cert -HashAlgorithm SHA256
          # 确保证书输出目录存在（CI 不保留仓库内的 cert/ 目录）
          New-Item -ItemType Directory -Force -Path "VSPD\Vspd.Driver\cert" | Out-Null
          $cer = "VSPD\Vspd.Driver\cert\vspd-test.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Remove-Item $cert.PSPath
          # 打包 vspd.sys + vspd.inf + 测试证书(.cer)，便于下载与安装时导入
          Compress-Archive -Path $sys, "VSPD\Vspd.Driver\vspd.inf", $cer -DestinationPath vspd-driver.zip -Force
          Write-Host "已签名并打包：vspd-driver.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vspd-driver
          path: vspd-driver.zip

      - name: Publish to GitHub Release (附件下载更方便)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vspd-driver-${{ github.run_number }}
          name: VSPD Driver Build ${{ github.run_number }}
          files: vspd-driver.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
