name: Build VSPD Kernel Driver

# 方案 B（最终采用）：直接用 GitHub windows runner 预装的 Visual Studio 2022 + WDK，
# 通过 microsoft/setup-msbuild（内部用 vswhere）正确初始化 MSBuild 环境，无需 EWDK ISO。
#
# 为什么放弃 EWDK ISO（方案 A）—— 根因复盘：
#   EWDK 是“自包含”环境，靠 LaunchBuildEnv.cmd 临时设置 VSINSTALLDIR/VCTargetsPath。
#   但 GitHub windows runner 本身已预装 VS2022，LaunchBuildEnv 在检测/覆盖这些变量时，
#   会解析成「缺盘符 / 缺 Program Files 的相对路径」
#   （例：E:\Microsoft Visual Studio\2022\...\Microsoft.Cpp.Default.props 缺失 → MSB4019），
#   且每个版本 EWDK（28000 / 26100）行为还不一致。这是之前一路 MSB1008→MSB8070 崩的根因：
#   EWDK 方案本质是“在已装 VS 的机器上再套一层自包含环境”，路径冲突不可避免。
#   当时用一堆 /p: 全局属性去硬覆盖 MSBuild 自带属性链，只是和编译器打地鼠，补一个崩一个。
#
# 方案 B 是微软官方 Windows-driver-samples 仓库 CI 的标准写法：runner 上的
# VS2022 + WDK 是“正常安装”的，setup-msbuild 用 vswhere 找到它并正确初始化，
# 不存在路径冲突，一次跑通。只传 Configuration/Platform/PlatformToolset，不覆盖任何环境变量。
#
# 注：windows-latest 当前为 Windows Server 2025 + WDK 10.0.26100（支持 KMDF 1.33）；
#     windows-2022 为 WDK 10.0.22621（同样支持 KMDF 1.33）。两者均可，这里用 windows-latest。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'VSPD/Vspd.Driver/**'
      - '.github/workflows/build-driver.yml'

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build-driver:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH (初始化 VS2022 + WDK 环境)
        uses: microsoft/setup-msbuild@v2

      - name: Build vspd.sys (Release, x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proj = Join-Path $env:GITHUB_WORKSPACE "VSPD\Vspd.Driver\vspd.vcxproj"
          if (-not (Test-Path $proj)) { throw "vcxproj not found: $proj" }
          # 打印关键环境，便于一次性定位问题（不再被动等编译器逐个报 MSB）
          Write-Host "=== build env ==="
          Write-Host ("MSBuild: " + (Get-Command msbuild).Source)
          Write-Host ("VSINSTALLDIR=" + $env:VSINSTALLDIR)
          Write-Host ("VCTargetsPath=" + $env:VCTargetsPath)
          Write-Host ("WindowsSdkDir=" + $env:WindowsSdkDir)
          Write-Host ("WDKContentRoot=" + $env:WDKContentRoot)
          # setup-msbuild 已正确初始化 VS+WDK，直接 msbuild 即可。
          # 只传 Configuration/Platform/PlatformToolset，不覆盖任何环境变量。
          msbuild $proj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=WindowsKernelModeDriver10.0 `
            /p:TargetVersion=Windows10 `
            /v:normal
          if ($LASTEXITCODE -ne 0) { throw ("Driver build failed (msbuild exit " + $LASTEXITCODE + ")") }
          Write-Host "Driver build OK."

      - name: Sign & package driver (test cert)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sys = Get-ChildItem -Path "VSPD\Vspd.Driver" -Filter vspd.sys -Recurse | Select-Object -First 1
          if (-not $sys) { throw "vspd.sys not found, build likely failed" }
          Write-Host ("Found vspd.sys at " + $sys.FullName)
          # 每次构建生成自签测试证书：签名与 .cer 同包，安装时导入即可（避免仓库存私钥）
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=VSPD Test Signing" `
                  -CertStoreLocation "Cert:\CurrentUser\My" -KeyUsage DigitalSignature `
                  -NotAfter (Get-Date).AddYears(10)
          Set-AuthenticodeSignature -FilePath $sys.FullName -Certificate $cert -HashAlgorithm SHA256
          New-Item -ItemType Directory -Force -Path "VSPD\Vspd.Driver\cert" | Out-Null
          $cer = "VSPD\Vspd.Driver\cert\vspd-test.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Remove-Item $cert.PSPath
          Compress-Archive -Path $sys.FullName, "VSPD\Vspd.Driver\vspd.inf", $cer `
            -DestinationPath vspd-driver.zip -Force
          Write-Host "Packaged: vspd-driver.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vspd-driver
          path: vspd-driver.zip

      - name: Publish to GitHub Release (附件下载更方便)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vspd-driver-${{ github.run_number }}
          name: VSPD Driver Build ${{ github.run_number }}
          files: vspd-driver.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
